# Tự build KySoPDF trên GitHub (không cần cài gì trên máy bạn).
# Cách dùng: tab Actions -> "Build exe" -> Run workflow -> đợi dấu tích xanh -> tải ở mục Artifacts.
name: Build exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      # python-pkcs11 KHÔNG có bản cài sẵn cho Windows 32-bit, pip phải tự biên dịch
      # từ mã nguồn C -> cần trình biên dịch MSVC 32-bit. Bước này bật nó lên.
      - name: Bật trình biên dịch MSVC 32-bit (chỉ bản x86)
        if: matrix.arch == 'x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      # --prefer-binary: ưu tiên bản cài sẵn (wheel) dù cũ hơn một chút. Cần vì cryptography
      # bản 49 trở lên không còn bản cho Windows 32-bit, nếu không pip sẽ tự biên dịch bằng Rust và lỗi.
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --prefer-binary -r requirements.txt pyinstaller
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --onedir --noupx --name KySoPDF
          --add-data "index.html;."
          --collect-all pyhanko --collect-all pyhanko_certvalidator --collect-all pkcs11
          --hidden-import uharfbuzz --hidden-import fontTools
          agent.py
      - name: Smoke test (chạy thử file vừa build)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KySoPDF\KySoPDF.exe" -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 15
          Write-Host "--- trang chu ---"
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/).StatusCode
          Write-Host "--- status ---"
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/status).Content
          Write-Host "--- diagnose ---"
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/diagnose).Content
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KySoPDF-${{ matrix.arch }}
          path: dist/KySoPDF
